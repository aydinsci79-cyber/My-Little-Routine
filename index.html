<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#39204f">
<meta name="description" content="My Little Routine — دفتر جادویی روتین‌های شخصی">
<title>My Little Routine</title>
<style>
:root{--ink:#38204f;--plum:#55346e;--lav:#d9b9ed;--pink:#f5c9dc;--cream:#fff2ed;--gold:#ffd98a;--glass:rgba(255,239,250,.87);--line:rgba(255,255,255,.78);--shadow:0 8px 28px rgba(35,13,55,.23)}
*{box-sizing:border-box}html{min-height:100%;background:#241634}body{margin:0;min-height:100dvh;color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;background:linear-gradient(180deg,rgba(38,18,60,.28),rgba(45,19,62,.35)),url("assets/backgrounds/magical-bedroom-original.jpg") center/cover fixed no-repeat; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{width:min(100%,560px);min-height:100dvh;margin:auto;position:relative;padding:14px 14px 100px;background:linear-gradient(180deg,rgba(43,20,61,.13),rgba(44,20,60,.30))}
.top{display:flex;align-items:center;justify-content:space-between;color:#fff;text-shadow:0 2px 8px #39204f;padding:8px 4px 14px}.brand{font-size:25px;font-weight:900;letter-spacing:.2px}.sub{font-size:11px;opacity:.9;margin-top:4px}.round{width:42px;height:42px;border-radius:50%;background:rgba(255,232,250,.9);box-shadow:var(--shadow);font-size:20px}
.glass{background:var(--glass);border:1.5px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:25px}
.tabs{display:flex;gap:7px;padding:6px;margin:0 0 14px}.tabs button{flex:1;padding:11px 8px;border-radius:19px;background:transparent;font-weight:800}.tabs button.active{background:linear-gradient(120deg,#8154a2,#a86fae);color:white;box-shadow:0 4px 12px #7a4b8d55}
.hero{padding:15px 16px;margin-bottom:13px}.hero h1{font-size:20px;margin:0 0 5px}.hero p{font-size:12px;line-height:1.8;margin:0;color:#70537d}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.routine{position:relative;padding:12px;overflow:hidden;min-height:218px;border-radius:25px;background:linear-gradient(145deg,rgba(255,238,249,.94),rgba(238,215,250,.84));border:2px solid rgba(255,255,255,.85);box-shadow:var(--shadow)}
.routine:before{content:"✦";position:absolute;top:8px;left:12px;color:#d39a44;font-size:20px}.routine .emoji{font-size:34px;display:block;text-align:center;margin:2px auto 7px;filter:drop-shadow(0 3px 2px #714e8855)}.routine h3{text-align:center;font-size:15px;margin:5px 0 8px}.routine p{font-size:11px;line-height:1.9;margin:0;color:#644b72}.routine .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:10px;color:#785b86}.smallbtn{background:#8052a1;color:white;border-radius:14px;padding:7px 10px;font-size:11px}
.addwide{display:block;width:100%;margin:14px 0 0;padding:13px;border-radius:22px;background:linear-gradient(110deg,#f4c7dc,#d6b0ec);border:1px solid white;font-weight:900;box-shadow:var(--shadow)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;color:white;text-shadow:0 2px 8px #342047;margin:8px 3px 12px}.sectionhead h2{margin:0;font-size:19px}
.panel{padding:15px;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:6px;margin:9px 0}.field label{font-size:12px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid #d6b9e1;border-radius:14px;background:#fff9fd;padding:11px;color:var(--ink);outline:none}.field textarea{min-height:70px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary,.secondary,.danger{border-radius:15px;padding:11px 15px;font-weight:800}.primary{background:linear-gradient(110deg,#8050a0,#a76fae);color:white}.secondary{background:#f5e5f5}.danger{background:#f8d8df;color:#813b58}
.typepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.typepick button{padding:12px 5px;border-radius:16px;background:#f8eafa;border:1px solid #e0c7e8;font-size:12px;font-weight:800}.typepick button.sel{background:#8153a0;color:#fff}
.activity{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #ead8ee}.activity:last-child{border:0}.activity .ico{font-size:22px;width:30px;text-align:center}.activity .txt{flex:1;min-width:0}.activity strong{font-size:13px}.activity small{display:block;color:#80688c;font-size:10px;margin-top:4px}.activity input[type=checkbox]{width:18px;height:18px;accent-color:#8254a0}
.catbox{padding:12px;border-radius:19px;margin:10px 0;border:1px solid #fff;background:rgba(255,255,255,.54)}.cathead{display:flex;align-items:center;gap:8px;margin-bottom:6px}.cathead strong{flex:1}.cathead input{width:100%;max-width:140px}.colorchip{width:26px;height:26px;border:2px solid white;border-radius:50%;padding:0}
.timeline{border-right:2px solid #cba8dc;margin:8px 7px;padding-right:14px}.timeitem{position:relative;padding:8px 10px;margin:8px 0;background:#fff9;border-radius:15px}.timeitem:before{content:"";position:absolute;right:-21px;top:16px;width:10px;height:10px;border-radius:50%;background:#8c5ca8;border:2px solid white}.timeitem time{font-size:10px;color:#795b88}.timeitem strong{display:block;font-size:13px;margin-top:4px}
.nav{position:fixed;z-index:5;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 22px),530px);display:flex;justify-content:space-around;padding:8px 5px;border-radius:24px;background:rgba(62,34,83,.91);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 28px #1b0b2a88;backdrop-filter:blur(12px);color:#f9eaff}.nav button{background:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:60px;padding:4px}.nav button b{font-size:21px}.nav button.active{color:#ffdc96}
.empty{text-align:center;padding:26px 12px;color:#72577d;font-size:13px;line-height:2}.hidden{display:none!important}.muted{font-size:11px;color:#80688c;line-height:1.8}.pill{display:inline-block;background:#f4e4f7;border-radius:20px;padding:5px 9px;font-size:10px;margin:2px}
.toast{position:fixed;z-index:9;bottom:90px;left:50%;transform:translateX(-50%);background:#39204f;color:white;padding:10px 15px;border-radius:18px;font-size:12px;box-shadow:var(--shadow);display:none}
@media(max-width:370px){.app{padding-inline:10px}.grid{gap:8px}.routine{padding:9px;min-height:205px}.routine h3{font-size:13px}.brand{font-size:22px}.nav button{min-width:53px}}
@media(min-width:700px){body{background-attachment:fixed}.app{border-inline:1px solid #ffffff33}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="brand">My Little Routine ✦</div><div class="sub">دفتر کوچک روتین‌های جادویی تو</div></div>
    <button class="round" onclick="showPage('settings')" aria-label="تنظیمات">⚙️</button>
  </header>
  <main id="view"></main>
</div>
<nav class="nav">
  <button data-page="home" class="active" onclick="showPage('home')"><b>⌂</b>خانه</button>
  <button data-page="routines" onclick="showPage('routines')"><b>✦</b>روتین‌ها</button>
  <button data-page="create" onclick="startCreate()"><b>＋</b>جدید</button>
  <button data-page="settings" onclick="showPage('settings')"><b>🐈</b>بیشتر</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const KEY='myLittleRoutine.v1';
let data=load(), page='home', editId=null, createType='simple';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{routines:[]}}catch(e){return {routines:[]}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));}
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
function showPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function startCreate(){editId=null;createType='simple';showPage('create')}
function render(){let v=document.getElementById('view');if(page==='home'||page==='routines')v.innerHTML=home();else if(page==='create')v.innerHTML=editor();else if(page==='detail')v.innerHTML=detail();else if(page==='settings')v.innerHTML=settings();else v.innerHTML=home()}
function home(){let list=data.routines;return `<section class="hero glass"><h1>به دنیای کوچولوی روتین‌هات خوش اومدی 🌙</h1><p>اینجا فقط روتین‌هایی رو نگه می‌داری که خودت می‌سازی؛ لازم نیست هر روز ازشون استفاده کنی.</p></section><div class="sectionhead"><h2>دفتر روتین‌ها</h2><span>${list.length} روتین</span></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="glass empty">هنوز روتینی نساختی ✨<br>اولین برنامه دلخواهت رو بساز؛ ساده، دسته‌بندی‌شده یا زمان‌دار.</div>`}<button class="addwide" onclick="startCreate()">✦ ساخت روتین جدید ＋</button>`}
function card(r){let n=r.type==='simple'?r.items.length:r.type==='categories'?r.categories.reduce((a,c)=>a+c.items.length,0):r.items.length;let desc=r.type==='categories'?r.categories.map(c=>c.name).join(' · '):r.type==='timed'?r.items.slice(0,2).map(i=>i.start+' '+i.name).join(' · '):r.items.slice(0,2).map(i=>i.name).join(' · ');return `<article class="routine" style="background:linear-gradient(145deg,${esc(r.color||'#f9e7f2')}ee,rgba(239,218,249,.88))"><span class="emoji">${esc(r.icon||'🌙')}</span><h3>${esc(r.name)}</h3><p>${esc(desc||'هنوز فعالیتی اضافه نشده')}</p><div class="meta"><span>${n} فعالیت</span><button class="smallbtn" onclick="openDetail('${r.id}')">باز کردن ←</button></div></article>`}
function editor(){let r=editId?data.routines.find(x=>x.id===editId):null;let type=r?.type||createType;return `<div class="sectionhead"><h2>${r?'ویرایش روتین':'ساخت روتین جدید'}</h2><button class="round" onclick="showPage('home')">×</button></div><section class="glass panel"><div class="field"><label>نوع روتین</label><div class="typepick">${[['simple','ساده ☁️'],['categories','دسته‌بندی 🪻'],['timed','زمان‌دار ⏰']].map(([k,t])=>`<button class="${type===k?'sel':''}" onclick="chooseType('${k}')">${t}</button>`).join('')}</div></div><div class="field"><label>اسم روتین</label><input id="rname" placeholder="مثلاً برنامه دانشگاه" value="${esc(r?.name||'')}"></div><div class="field"><label>آیکون</label><input id="ric" maxlength="4" value="${esc(r?.icon||'🌙')}" placeholder="🌙"></div><div class="field"><label>رنگ روتین</label><input id="rcolor" type="color" value="${esc(r?.color||'#e9c9ef')}" style="height:45px;padding:4px"></div><div id="typeFields">${typeFields(r,type)}</div><div class="actions"><button class="primary" onclick="saveRoutine()">ذخیره روتین ✨</button><button class="secondary" onclick="showPage('home')">انصراف</button></div></section>`}
function typeFields(r,type){if(type==='categories'){let cats=r?.categories||[{id:uid(),name:'انرژی کم',color:'#e8c7e9',icon:'🌙',items:[]},{id:uid(),name:'انرژی متوسط',color:'#f4d3c8',icon:'🌷',items:[]},{id:uid(),name:'انرژی زیاد',color:'#d9d1f5',icon:'⚡',items:[]}];return `<div id="catEditor">${cats.map(c=>catEditor(c)).join('')}</div><button class="secondary" onclick="addCategory()">＋ افزودن دسته</button>`}
let items=r?.items||[];return `<div id="itemEditor">${items.map((it,i)=>itemEditor(it,i,type)).join('')}</div><button class="secondary" onclick="addItem('${type}')">＋ افزودن فعالیت</button><p class="muted">${type==='timed'?'برای هر فعالیت ساعت شروع و پایان را مشخص کن. هم‌پوشانی ساعت‌ها در نسخه آزمایشی هشدار داده نمی‌شود.':'فعالیت‌ها ساعت اجباری ندارند؛ هر تعداد خواستی اضافه کن.'}</p>`}
function itemEditor(it={},i=0,type='simple'){return `<div class="catbox itemrow"><div class="field"><label>نام فعالیت</label><input class="iname" placeholder="مثلاً کلاس دانشگاه" value="${esc(it.name||'')}"></div><div class="field"><label>آیکون</label><input class="iicon" value="${esc(it.icon||'📚')}" maxlength="4"></div>${type==='timed'?`<div class="grid"><div class="field"><label>از ساعت</label><input class="istart" type="time" value="${esc(it.start||'08:00')}"></div><div class="field"><label>تا ساعت</label><input class="iend" type="time" value="${esc(it.end||'10:00')}"></div></div>`:''}<button class="danger" onclick="this.closest('.itemrow').remove()">حذف فعالیت</button></div>`}
function catEditor(c){return `<div class="catbox catrow" data-id="${c.id}"><div class="cathead"><input class="cicon" value="${esc(c.icon||'🌙')}" maxlength="4"><input class="cname" value="${esc(c.name)}" aria-label="نام دسته"><input class="ccolor colorchip" type="color" value="${esc(c.color||'#e8c7e9')}"></div><div class="catitems">${(c.items||[]).map(it=>`<div class="activity"><span class="ico">${esc(it.icon||'✨')}</span><span class="txt"><strong>${esc(it.name)}</strong></span></div>`).join('')}</div><button class="secondary" onclick="addCatItem(this)">＋ فعالیت در این دسته</button> <button class="danger" onclick="this.closest('.catrow').remove()">حذف دسته</button></div>`}
function chooseType(t){createType=t;let old=readEditorFields();document.getElementById('typeFields').innerHTML=typeFields(old,t);document.querySelectorAll('.typepick button').forEach(b=>b.classList.toggle('sel',b.textContent.includes(t==='simple'?'ساده':t==='categories'?'دسته‌بندی':'زمان‌دار')))}
function readEditorFields(){return {items:[...document.querySelectorAll('.itemrow')].map(row=>({name:row.querySelector('.iname')?.value,icon:row.querySelector('.iicon')?.value,start:row.querySelector('.istart')?.value,end:row.querySelector('.iend')?.value}))}}
function addItem(t){document.getElementById('itemEditor').insertAdjacentHTML('beforeend',itemEditor({},0,t))}
function addCategory(){document.getElementById('catEditor').insertAdjacentHTML('beforeend',catEditor({id:uid(),name:'دسته جدید',icon:'🌸',color:'#e8c7e9',items:[]}))}
function addCatItem(btn){let row=btn.closest('.catrow');let name=prompt('نام فعالیت را بنویس:');if(!name)return;let icon=prompt('یک آیکون وارد کن:', '✨')||'✨';let div=document.createElement('div');div.className='activity';div.innerHTML=`<span class="ico">${esc(icon)}</span><span class="txt"><strong>${esc(name)}</strong></span>`;row.querySelector('.catitems').append(div)}
function saveRoutine(){let name=document.getElementById('rname').value.trim();if(!name){toast('اسم روتین رو بنویس');return}let type=createType;let items=[],categories=[];if(type==='categories'){categories=[...document.querySelectorAll('.catrow')].map(row=>({id:row.dataset.id||uid(),name:row.querySelector('.cname').value||'دسته جدید',icon:row.querySelector('.cicon').value||'🌸',color:row.querySelector('.ccolor').value,items:[...row.querySelectorAll('.activity')].map(a=>({name:a.querySelector('strong').textContent,icon:a.querySelector('.ico').textContent}))}))}else{items=[...document.querySelectorAll('.itemrow')].map(row=>({name:row.querySelector('.iname').value.trim(),icon:row.querySelector('.iicon').value||'✨',start:row.querySelector('.istart')?.value||'',end:row.querySelector('.iend')?.value||''})).filter(i=>i.name)}
let obj={id:editId||uid(),name,icon:document.getElementById('ric').value||'🌙',color:document.getElementById('rcolor').value,type,items,categories};if(editId){let ix=data.routines.findIndex(x=>x.id===editId);data.routines[ix]=obj}else data.routines.push(obj);persist();editId=null;toast('روتین ذخیره شد 💜');showPage('home')}
function openDetail(id){editId=id;page='detail';render()}
function detail(){let r=data.routines.find(x=>x.id===editId);if(!r)return home();let body='';if(r.type==='categories'){body=r.categories.map(c=>`<div class="catbox" style="background:${esc(c.color)}99"><h3>${esc(c.icon)} ${esc(c.name)}</h3>${c.items.map((it,i)=>activityRow(it,r.id,c.id,i)).join('')}<button class="secondary" onclick="addDetailCatItem('${r.id}','${c.id}')">＋ فعالیت</button></div>`).join('')}else if(r.type==='timed'){body=`<div class="timeline">${r.items.slice().sort((a,b)=>a.start.localeCompare(b.start)).map((it,i)=>`<div class="timeitem"><time>${esc(it.start)} – ${esc(it.end)}</time><strong>${esc(it.icon)} ${esc(it.name)}</strong><input type="checkbox" onchange="toggleDone('${r.id}','',${i},this.checked)"> انجام شد</div>`).join('')}</div>`}else{body=r.items.map((it,i)=>activityRow(it,r.id,'',i)).join('')}
return `<div class="sectionhead"><h2>${esc(r.icon)} ${esc(r.name)}</h2><button class="round" onclick="showPage('home')">×</button></div><section class="glass panel"><div class="meta"><span class="pill">${r.type==='simple'?'روتین ساده':r.type==='timed'?'روتین زمان‌دار':'روتین دسته‌بندی‌شده'}</span><span class="pill">${(r.items||[]).length+(r.categories||[]).reduce((a,c)=>a+c.items.length,0)} فعالیت</span></div>${body||'<div class="empty">هنوز فعالیتی نداری.</div>'}<div class="actions"><button class="primary" onclick="editRoutine('${r.id}')">ویرایش روتین</button><button class="secondary" onclick="exportRoutine('${r.id}')">خروجی تصویری</button><button class="danger" onclick="deleteRoutine('${r.id}')">حذف روتین</button></div></section>`}
function activityRow(it,rid,cid,i){return `<div class="activity"><input type="checkbox" onchange="this.parentElement.classList.toggle('done',this.checked)"><span class="ico">${esc(it.icon||'✨')}</span><span class="txt"><strong>${esc(it.name)}</strong></span></div>`}
function toggleDone(){}
function addDetailCatItem(rid,cid){let r=data.routines.find(x=>x.id===rid),c=r.categories.find(x=>x.id===cid);let n=prompt('نام فعالیت؟');if(!n)return;c.items.push({name:n,icon:prompt('آیکون؟','✨')||'✨'});persist();render()}
function editRoutine(id){editId=id;let r=data.routines.find(x=>x.id===id);createType=r.type;page='create';render()}
function deleteRoutine(id){if(!confirm('این روتین حذف شود؟'))return;data.routines=data.routines.filter(x=>x.id!==id);persist();editId=null;showPage('home')}
function settings(){return `<div class="sectionhead"><h2>تنظیمات ✨</h2></div><section class="glass panel"><h3>پشتیبان‌گیری</h3><p class="muted">اطلاعات روتین‌ها در همین مرورگر ذخیره می‌شود. برای انتقال یا نگهداری نسخه پشتیبان بگیر.</p><div class="actions"><button class="primary" onclick="backup()">خروجی پشتیبان JSON</button><label class="secondary">بازیابی فایل<input type="file" accept=".json,application/json" onchange="restore(event)" hidden></label></div><hr style="border:0;border-top:1px solid #ead8ee;margin:18px 0"><h3>درباره برنامه</h3><p class="muted">نسخه آزمایشی My Little Routine برای نمایشگرهای موبایل، با چیدمان واکنش‌گرا و ذخیره محلی.</p><p class="muted">برای نصب: از منوی مرورگر گزینه Add to Home screen را انتخاب کن. این نسخه هنوز PWA آفلاین کامل نیست.</p></section>`}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});downloadBlob(blob,'my-little-routine-backup.json')}
function restore(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x.routines))throw 0;data=x;persist();toast('بازیابی انجام شد');showPage('home')}catch(err){toast('فایل پشتیبان معتبر نیست')}};rd.readAsText(f)}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportRoutine(id){let r=data.routines.find(x=>x.id===id);let c=document.createElement('canvas');c.width=1080;c.height=1920;let ctx=c.getContext('2d');let g=ctx.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#35204e');g.addColorStop(.5,'#8a5ca5');g.addColorStop(1,'#e9c7e2');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff0fa';ctx.font='bold 54px sans-serif';ctx.textAlign='center';ctx.fillText(r.icon+' '+r.name,540,150);ctx.font='32px sans-serif';let y=260;let list=r.type==='categories'?r.categories.flatMap(cat=>[{name:cat.icon+' '+cat.name,head:true},...cat.items]):r.items;for(let it of list){if(y>1740)break;ctx.fillStyle=it.head?'#ffd99a':'#fff5fb';ctx.font=it.head?'bold 36px sans-serif':'30px sans-serif';ctx.textAlign='right';let label=(it.icon?it.icon+' ':'')+it.name+(it.start?'   '+it.start+'–'+it.end:'');ctx.fillText(label,970,y);y+=it.head?72:58}ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(65,70,950,1770);ctx.strokeStyle='#ffe6ff';ctx.lineWidth=5;ctx.strokeRect(65,70,950,1770);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='25px sans-serif';ctx.fillText('My Little Routine ✦',540,1810);c.toBlob(b=>downloadBlob(b,(r.name||'routine')+'.png'))}
render();
</script>
